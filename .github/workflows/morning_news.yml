name: Morning News Bot

on:
  schedule:
    # 💡 混雑（実行待ち）を回避するため端数分（12分）に設定
    # 毎日 協定世界時(UTC) 20:12 に実行 ＝ 日本時間(JST)で【毎朝 AM 5:12】
    - cron: '12 20 * * *'
  # GitHubの画面からいつでも手動で実行（テスト）できるようにする設定
  workflow_dispatch:

# GitHub Pagesの自動デプロイに必要なアクセス権限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install google-genai requests feedparser python-dotenv

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python main.py

    # 生成された index.html を自動的に GitHub Pages 向けにデプロイ
    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4