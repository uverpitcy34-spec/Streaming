name: Morning News Bot

on:
  schedule:
    # 💡 混雑（大渋滞）を100%回避するため、あえて「18分」という超中途半端な端数に設定します！
    # 毎日 協定世界時(UTC) 20:18 に実行 ＝ 日本時間(JST)で【毎朝 AM 5:18】
    # これにより割り当て待ちキューをスッと通過でき、毎朝確実に朝6時前後に配信が完了します。
    - cron: '18 20 * * *'
  # GitHubの画面からいつでも手動で実行（テスト）できるようにする設定
  workflow_dispatch:

# GitHub Pagesの自動デプロイに必要なアクセス権限を明示
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install google-generativeai requests feedparser python-dotenv

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python main.py

    # 生成された index.html を自動的に GitHub Pages 向けにパッケージ・公開する
    - name: Upload artifact for Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
